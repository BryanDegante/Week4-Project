<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 4 Project</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <script
      src="https://kit.fontawesome.com/4d8445498a.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <section id="landing">
      <nav>
        <div class="nav__container">
          <img src="./assets/blinker-icon.4f9b2663.png" class="logo" alt="" />
          <div class="link__list">
            <ul>
              <li>
                <a href="#" class="nav__link link__hover--effect">Home</a>
              </li>
              
            </ul>
          </div>
        </div>
      </nav>

      <header>
        <div class="container">
          <div class="row">
            <div class="landing__text white">
              <h1 class="landing__text--header">
                Discover your next favorite movie
              </h1>
              <p class="landing__text--para">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do
                eiusmod tempor incididunt ut labore et dolore magna aliqua.
              </p>
              <div class="search__wrapper">
                <input
                  type="text"
                  class="search__bar"
                  onchange="onSearchChange(event)"
                  placeholder="Search for a movie"
                />
                <div class="icon__wrapper">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>
    </section>
    <main>
      <section id="movies__main">
        <div class="container">
          <div class="row">
            <div class="slider__wrapper">
              <div class="year__wrapper">

                <input type="range" min="1900" max="2025" class="slider" id="slider__range" onchange="movieYear()" />
                <p class ="year  white">Filter By Year: <span id="demo"></span></p>
                <button class="reset__button" onclick="resetMovies()">Reset</button>
              </div>
            </div>

            <div class="movies">
              
            </div>
            <div class="page__list"></div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="container">
        <div class="row">
        </div>
      </div>
      
    </footer>
  </body>
</html>
