<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="movies.js" defer></script>
    <script
      src="https://kit.fontawesome.com/4d8445498a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav>
      <div class="nav__container">
        <a href="index.html">
          <img src="./assets/blinker-icon.4f9b2663.png" class="logo" alt="" />
        </a>
        <div class="link__list">
          <ul>
            <li>
              <a href="index.html" class="nav__link link__hover--effect"
                >Home</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <section id="movie__info">
      <div class="container">
        <div class="row">
          <div class="back__button--wrapper">
            <button
              class="back__button"
              onclick="javascript:window.history.back();"
            >
              <i class="fa-solid fa-arrow-left"></i> Back
            </button>
          </div>
          <div class="movie__description--single">
            <div class="movie__description--header">
              <div class="movie__title--single"></div>
              <div class="movie__ratings"></div>
            </div>
            <div class="movie__wrapper">
              <div class="movie__poster--wrapper">
                <figure class="movie__description--poster">
                  <img src="" class="movie__poster" alt="" />
                </figure>
              </div>
              <div class="movie__description--text">
                <div class="movie__realease"></div>
                <div class="moive__runtime"></div>
                <div class="movie__Age-rating"></div>
                <div class="movie__Director"></div>
                <div class="movie__writer"></div>
                <div class="movie__genre"></div>
                <div class="movie__actors"></div>
                <div class="movie__plot"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
